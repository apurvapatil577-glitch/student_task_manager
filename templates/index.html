<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#667eea,#764ba2);
            text-align:center;
        }

        h1{
            width:100%;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(10px);
            color:white;
            padding:25px;
            font-size:38px;
            font-weight:bold;
            letter-spacing:1px;
            box-shadow:0 4px 15px rgba(0,0,0,0.2);
        }

        .menu{
            margin:50px auto;
            width:90%;
            max-width:1100px;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .menu a{
            text-decoration:none;
            color:white;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(10px);
            border-radius:15px;
            padding:20px;
            width:220px;
            height:100px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            font-weight:600;
            transition:all 0.3s ease;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .menu a:hover{
            transform:translateY(-8px);
            background:white;
            color:#764ba2;
            box-shadow:0 12px 25px rgba(0,0,0,0.3);
        }

        @media(max-width:768px){
            .menu a{
                width:100%;
                max-width:350px;
            }

            h1{
                font-size:28px;
            }
        }
    </style>

</head>
<body>

    <h1>🎓 Student Management System</h1>

    <div class="menu">
        <a href="{{ url_for('students') }}">📚 Students</a>

        <a href="{{ url_for('add_students') }}">➕ Add Student</a>

        <a href="{{ url_for('tasks') }}">📝 Tasks</a>

        <a href="{{ url_for('add_task') }}">📋 Add Task</a>

        <a href="{{ url_for('assign_task') }}">✅ Assign Task</a>

        <a href="{{ url_for('student_tasks') }}">👨‍🎓 Student Tasks</a>

        <a href="{{ url_for('attendance') }}">📅 Attendance</a>

        <a href="{{ url_for('attendance_report') }}">📊 Attendance Report</a>
    </div>

</body>
</html>
