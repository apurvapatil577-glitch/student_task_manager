<!DOCTYPE html>
<html>
<head>
    <title>Task List</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }

        .container{
            width:85%;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
            text-align:center;
        }

        td{
            padding:10px;
            text-align:center;
            border:1px solid #ddd;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        tr:hover{
            background:#dbeafe;
        }
    </style>

</head>
<body>

{% include 'navbar.html' %}

<div class="container">

    <h2>Task List</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Task Name</th>
            <th>Description</th>
        </tr>

        {% for task in tasks %}

        <tr>
            <td>{{ task.task_id }}</td>
            <td>{{ task.task_name }}</td>
            <td>{{ task.description }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
