<!DOCTYPE html>
<html>
<head>
    <title>Student Tasks</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }

        .container{
            width:85%;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#28a745;
            color:white;
            padding:12px;
            text-align:center;
        }

        td{
            padding:10px;
            text-align:center;
            border:1px solid #ddd;
        }

        tr:nth-child(even){
            background:#f8f9fa;
        }

        tr:hover{
            background:#d4edda;
        }
    </style>      

</head>
<body>

{% include 'navbar.html' %}

<div class="container">

    <h2>Student Tasks</h2>

    <table>

        <tr>
            <th>Student</th>
            <th>Task</th>
            <th>Status</th>
        </tr>

        {% for row in student_tasks %}

        <tr>
            <td>{{ row.first_name }}</td>
            <td>{{ row.task_name }}</td>
            <td>{{ row.status }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
