<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }

        .container-form{
            width:700px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        .row{
            display:flex;
            gap:20px;
            margin-bottom:15px;
        }

        .form-group{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        .full-width{
            margin-bottom:15px;
        }

        label{
            font-weight:bold;
            margin-bottom:5px;
        }

        input,
        select{
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:14px;
        }

        button{
            width:100%;
            padding:12px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#218838;
        }
    </style>
</head>
<body>     

    {% include 'navbar.html' %}

<div class="container-form">

    <h1>📝 Add Student</h1>

    <form method="POST">

        <div class="row">

            <div class="form-group">
                <label>First Name</label>
                <input type="text"
                       name="first_name"
                       required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text"
                       name="last_name"
                       required>
            </div>

        </div>

        <div class="row">

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel"
                       name="mobile_number"
                       pattern="[0-9]{10}"
                       required>
            </div>

        </div>

        <div class="full-width">
            <label>Email</label>
            <input type="email"
                   name="email"
                   required>
        </div>

        <div class="full-width">
            <label>Course Name</label>
            <input type="text"
                   name="course_name"
                   required>
        </div>

        <div class="full-width">
            <label>Admission Date</label>
            <input type="date"
                   name="admission_date"
                   required>
        </div>

        <button type="submit">
            ✓ Add Student
        </button>

    </form>

</div>

</body>
</html>
