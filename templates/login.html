<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body{
            margin:0;
            padding:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:#f2f2f2;
            font-family:Arial, sans-serif;
        }

        .login-box{
            background:white;
            padding:30px;
            width:320px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            margin-bottom:20px;
        }

        input{
            width:90%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            width:95%;
            padding:10px;
            background-color:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background-color:#0056b3;
        }

        /* Profile image animation */
        .profile-img{
            width:100px;
            height:100px;
            border-radius:50%;
            border:3px solid #0d6efd;
            animation: pop 0.6s ease;
        }

        @keyframes pop{
            0%{ transform: scale(0); opacity:0; }
            100%{ transform: scale(1); opacity:1; }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>User Login</h2>

        <form method="POST" onsubmit="showMessage(event)">

            <label>Username</label><br>
            <input type="text" name="username" required>

            <label>Password</label><br>
            <input type="password" name="password" required>

            <button type="submit">Login</button>

        </form>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="welcomeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-body text-center">

                    <img src="{{ url_for('static', filename='images/profile.jpeg') }}"
                         class="profile-img mb-3">

                    <h2>Hello 👋</h2>

                    <p>
                        Welcome to Student Task Manager.<br>
                        Developed by <strong>Apurva patil</strong>.
                    </p>

                    <button class="btn btn-primary" data-bs-dismiss="modal">
                        Continue
                    </button>

                </div>

            </div>
        </div>
    </div>

    <script>
        function showMessage(event) {
            event.preventDefault();

            // show modal
            var modal = new bootstrap.Modal(document.getElementById('welcomeModal'));
            modal.show();

            // submit after 2 seconds (login backend)
            setTimeout(() => {
                document.querySelector("form").submit();
            }, 2000);
        }
    </script>

</body>
</html>
