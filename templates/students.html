{% extends "layout.html" %}

{% include 'navbar.html' %}

{% block content %}

<style>
    body{
        background:#f4f6fb;
    }

    h1{
        text-align:center;
        margin:20px 0;
        font-weight:bold;
        color:#f4e6e6;
    }

    .table-container{
        width:90%;
        margin:auto;
        background:white;
        padding:20px;
        border-radius:12px;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    table{
        width:100%;
        border-collapse:collapse;
        overflow:hidden;
        border-radius:10px;
    }

    thead{
        background: linear-gradient(90deg, #6a11cb, #2575fc);
        color:white;
    }

    thead th{
        padding:12px;
        text-align:left;
    }

    tbody td{
        padding:12px;
        border-bottom:1px solid #eee;
    }

    tbody tr:hover{
        background:#f1f7ff;
        transition:0.3s;
        transform: scale(1.01);
    }

    .badge-id{
        background:#28a745;
        color:white;
        padding:5px 10px;
        border-radius:20px;
        font-size:12px;
    }
</style>

<h1>Student Task Manager</h1>

<div class="table-container">

    <table class="table table-striped">

        <thead>
            <tr> 
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>
                    <span class="badge-id">{{ student.student_id }}</span>
                </td>
                <td>
                    {{ student.first_name }} {{ student.last_name }}
                </td>
                <td>{{ student.course_name }}</td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</div>

{% endblock %}
